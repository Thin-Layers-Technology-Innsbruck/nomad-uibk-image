services:
  api_host: "mti-thinlayertechnology.uibk.ac.at"
  api_base_path: "/nomad-oasis"
  upload_limit: 1000

oasis:
  is_oasis: true
  uses_central_user_management: true

plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image:  ghcr.io/thin-layers-technology-innsbruck/nomad-uibk-image/jupyter:main

meta:
  deployment: "UIBK-TLT-oasis"
  deployment_url: "mti-thinlayertechnology.uibk.ac.at/api"
  maintainer_email: "nikolai.kraus@uibk.ac.at"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  enable_new_hub_api: true

auth:
  require_authentication: true
  reject_unauthorized_users: true
