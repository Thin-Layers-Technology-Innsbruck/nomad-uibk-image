services:
  api_host: "https://mti-thinlayertechnology.uibk.ac.at/"
  api_base_path: "/nomad-oasis"

oasis:
  is_oasis: true
  uses_central_user_management: true

plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/fairmat-nfdi/nomad-north-jupyter:latest

meta:
  deployment: "UIBK-TLT-oasis"
  deployment_url: "https://mti-thinlayertechnology.uibk.ac.at/api"
  maintainer_email: "nikolai.kraus@uibk.ac.at"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  enable_new_hub_api: true
